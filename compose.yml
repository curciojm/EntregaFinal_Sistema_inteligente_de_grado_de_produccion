# Docker Compose es una forma declarativa de definir lo que querés ejecutar, en lugar de escribir los comandos de Docker uno por uno
# La reproducibilidad es una de las principales ventajas de Docker Compose, y por eso encaja tan bien con tu entrega final de IA Engineering
# para levantar el compose: docker compose up -d
# De todas maneras RUN.SH es importante. asi la aplicacion puede ejecutarse.
# Para que levante:
# docker compose config parece que es para ver que se va a levantar
# docker compose -f compose.yml up -d
# docker compose -f compose.yml ps comprobar si funciona (esto es como con docker comun)
# comproba que redis responde: docker compose -f compose.yml exec redis redis-cli ping
# levanta uvicorn. uvicorn app.main:app --reload
# abri: http://127.0.0.1:8000/docs proba con algo en process si luego arroja pending Swagger UI
# docker compose -f compose.yml exec redis redis-cli GET "task_status:753512ef-dfd8-4177-aaff-4171eb6f0e2e"
# confirma si Esto confirma que FastAPI está guardando correctamente la tarea en Redis
# y si el indicador quedo en cola: docker compose -f compose.yml exec redis redis-cli LRANGE multiagent_tasks 0 -1
# responde: 1) job id "753512ef-dfd8-4177-aaff-4171eb6f0e2e" que en mi app esta configurado para que sea tambien el nombre del thread
# Chequea redis hacelo variable de entorno a la dir asi no tenes que modificar el compose:
# $env:REDIS_URL = "redis://localhost:6379"
# y en main: REDIS_URL = os.getenv("REDIS_URL", "redis://localhost:6379")-- si no encuentra variable de entorno usa la siguiente
# chequea python -m app.worker
# no funciona con esta imagen, la bajamos: docker compose -f compose.yml down
# docker compose -f compose.yml up -d
# docker compose -f compose.yml exec redis redis-cli ping
# python -m app.worker
# Cierre: al presionar Ctrl+C, el script detiene la API y el worker,
# pero deja Redis y Phoenix encendidos en Docker. Para detener también esos contenedores, ejecutá docker compose down por separado.

